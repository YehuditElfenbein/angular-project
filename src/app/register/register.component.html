  <div class="card">
    <!-- *ngIf="user" -->
    <div class="card-body">
      <form [formGroup]="userForm">
            <div class="form-group">
                <label for="name">user name:</label>
                <input type="text" class="form-control" id="name" formControlName="name">
                <ng-container *ngIf="userForm.controls['name'].errors">
                    <div class="alert alert-danger" *ngIf="userForm.controls['name'].errors['required']">This field is required</div>
                    <div class="alert alert-danger" *ngIf="userForm.controls['name'].errors['minlength']">This field is must be at least 3 chars</div>
                </ng-container>
            </div>
            <div class="form-group">
                <label for="address">user address:</label>
                <input type="text" class="form-control" id="address" formControlName="address">
            </div>
            <div class="form-group">
                <label for="phone">student email:</label>
                <input type="text" class="form-control" id="email" formControlName="email">
                <ng-container *ngIf="userForm.controls['email'].errors">
                    <div class="alert alert-danger" *ngIf="userForm.controls['email'].errors['required']">This field is required</div>
                    <div class="alert alert-danger" *ngIf="userForm.controls['email'].errors['maxlength']">This field can't contain more than 20 chars</div>
                </ng-container>
            </div>
            <div class="form-group">
                <label for="isActive">student password:</label>
                <input type="password" class="form-control" id="password" formControlName="password">
                <ng-container *ngIf="userForm.controls['password'].errors">
                    <div class="alert alert-danger" *ngIf="userForm.controls['password'].errors['required']">This field is required</div>
                </ng-container>
            </div>
            
            

            {{userForm.value | json}}
            <button class="btn btn-primary"  [disabled]="!userForm.valid">save</button>

        </form>
    </div>
</div>
